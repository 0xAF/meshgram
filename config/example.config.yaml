---
# Example root config for Meshgram (split files)
#
# Copy this file to config/config.yaml and start with a minimal root:
#
#   config_version: 2
#   telemetry:
#     environment_enabled: false
#     environment_script: "./data/ha.sh"
#     environment_send_interval: 300
#
# Then copy and adapt the split example files as needed:
#   - example.telegram.yaml    -> telegram.yaml
#   - example.meshtastic.yaml  -> meshtastic.yaml
#   - example.channels.yaml    -> channels.yaml
#   - example.ai.yaml          -> ai.yaml
#   - example.logging.yaml     -> logging.yaml
#   - example.bbs.yaml         -> bbs.yaml

config_version: 2

telemetry:
  environment_enabled: false
  environment_script: "./data/ha.sh"
  environment_send_interval: 300

