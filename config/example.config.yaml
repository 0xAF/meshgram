---
# Example configuration for Meshgram
#
# Copy this file to config/config.yaml and adjust values for your setup.
# Env vars like ${TELEGRAM_BOT_TOKEN} are supported (via EnvYAML). Consider using direnv: https://direnv.net/

telegram:
  # Bot token from @BotFather (https://core.telegram.org/bots/tutorial)
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  # Target chat (supergroup) id as a negative integer, e.g. -1001234567890
  chat_id: -1001234567890
  # List of Telegram user IDs allowed to run privileged commands; empty list allows all users
  authorized_users:
    - 1111111111
  # Forward plain Telegram messages to the mesh (to meshtastic.default_node_id)
  enable_message_forwarding: false
  # Use Telegram Topics/Threads; map mesh channels to topic IDs under 'topics' below
  use_topics: false
  # Preserve incoming Markdown V2 formatting by default (set to false to always auto-escape)
  raw_markdown: false
  # Enable AI (Ollama) responses via Telegram command /ai
  ai_enabled: false  # renamed feature key 'ait'

meshtastic:
  # How to connect to your Meshtastic node: 'serial' or 'tcp'
  connection_type: serial
  # Serial device when using connection_type=serial (for TCP use "host:port")
  device: "/dev/ttyACM0"
  # Example TCP: uncomment the next line and set connection_type: tcp
  # device: "192.168.0.100:4403"

  # Where to send Telegram-originated messages on the mesh:
  #  - "^all" to broadcast
  #  - "!abcdef12" for a specific node id
  default_node_id: "^all"
  # Default mesh channel index for outbound messages (0..N)
  default_channel_id: 0
  # Channels to ignore (do not forward to Telegram)
  # ignored_channels: [1, 2]

  commands:
    ping: True # /ping command to get your hop count and node id back
    help: True # /help command
    ai: False  # enable /ai mesh command (feature key 'aim')
    travel: True  # enable /travel safety reminder command
  
  reply_directly: false # if true, /ping and /help replies go directly to the sender instead of the channel
  # Feature flag for AI replies originating from the mesh (/ai)
  ai_enabled: false  # feature key 'aim'

  # Link template to a node info page; {node_id} is replaced with the numeric id
  node_info_link: "https://meshmap.net/{node_id}"
  # Alternative example:
  # node_info_link: "https://malla.varna.radio/node/{node_id}"

# Optional human-friendly names for mesh channel indices
channels:
  - "LongFast"   # 0
  - "Bulgaria"   # 1

reports:
  # Control what information Meshgram posts/updates in Telegram
  telemetry: true
  location: false
  nodes: true

# Thread IDs for Telegram Topics (used when telegram.use_topics=true)
# How to get message_thread_id: https://stackoverflow.com/a/75178418/420585
topics:
  telemetry: 907
  location: 909
  nodes: 918
  channel0: 914
  channel1: 911

telemetry:
  # Periodically run a script and publish its metrics to the mesh
  environment_enabled: false
  environment_script: "./ha.sh"
  environment_send_interval: 300  # seconds

logging:
  # Global log level: debug | info | warn | error
  level: "info"
  # Per-library overrides (to reduce noise)
  level_telegram: "warn"
  level_httpx: "warn"
  # Write logs to a file as well as console
  file_log: false
  file_path: "meshgram.log"
  # Also send logs to syslog (optional)
  use_syslog: false
  syslog_host: "127.0.0.1"
  syslog_port: 514
  syslog_protocol: "udp"  # udp or tcp

# AI configuration (local Ollama model)
ai:
  # Base URL of the local Ollama server
  base_url: "http://127.0.0.1:11434"
  # Default model name to use
  model: "llama3"
  # Optional system prompt to steer behavior
  system_prompt: |
    You are a helpful assistant running on Meshtastic <-> Telegram bridge. Keep answers concise.
    You speak only in Bulgarian, unless the user specifically asks you to respond in English.
    If the user asks you to translate something, you can do so, but only if it is a short phrase or sentence. Do not translate long texts or documents.
    If the user asks you to write code, you can do so, but only if it is a short snippet. Do not write long programs or scripts.
    If the user asks you to generate text, you can do so, but only if it is a short paragraph or two. Do not generate long articles or essays.
    Always be funny and picky.
    Always answer short and concise.

