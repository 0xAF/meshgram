---
# Example configuration for Meshgram
#
# Copy this file to config/config.yaml and adjust values for your setup.
# Environment variables like ${TELEGRAM_BOT_TOKEN} and ${OPENAI_API_KEY}
# are supported via EnvYAML. Consider using direnv: https://direnv.net/

telegram:
  # Bot token from @BotFather (https://core.telegram.org/bots/tutorial)
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  # Target chat (supergroup) id as a negative integer, e.g. -1001234567890
  chat_id: -1001234567890
  # List of Telegram user IDs allowed to run privileged commands; empty list allows all users
  authorized_users:
    - 1111111111
  # Forward plain Telegram messages to the mesh (to meshtastic.default_node_id)
  enable_message_forwarding: false
  # Use Telegram Topics/Threads; map mesh channels to topic IDs under 'topics' below
  use_topics: false
  # Preserve incoming Markdown V2 formatting by default (set to false to always auto-escape)
  raw_markdown: false
  # Enable AI responses via Telegram command /ai (feature key 'ait')
  ai_enabled: false
  # Optional regex triggers to transform plain Telegram text into commands
  # Structure mirrors meshtastic.triggers
  triggers:
    - key: "^(ai|bot|бот|аи|ии)[:,\\s]+"
      op: "replace"
      val: "/ai "
  # Post a message in the default topic when the bot starts
  notify_on_start: true
  # Which topic to post the startup message into (when use_topics=true)
  # Use a key from the 'topics' section below or 'default'
  startup_topic: "default"

meshtastic:
  # How to connect to your Meshtastic node: 'serial' or 'tcp'
  connection_type: serial
  # Serial device when using connection_type=serial (for TCP use "host:port")
  device: "/dev/ttyACM0"
  # Example TCP: uncomment the next line and set connection_type: tcp
  # device: "192.168.0.100:4403"

  # Where to send Telegram-originated messages on the mesh:
  #  - "^all" to broadcast
  #  - "!abcdef12" for a specific node id
  default_node_id: "^all"
  # Default mesh channel index for outbound messages (0..N)
  default_channel_id: 0
  # Delay between sending message chunks (milliseconds)
  send_delay_ms: 200
  # Maximum number of chunks to send per message (excess will be summarized)
  max_send_chunks: 5
  # Template for truncation notice when a message exceeds max_send_chunks.
  # Use {omitted} to interpolate the number of omitted chunks.
  truncation_notice_template: "\n...and {omitted} more chunk(s) not sent: message too large"
  # Channels to ignore (do not forward to Telegram and do not respond)
  ignored_channels: []
  # Channels to receive-only (forward to Telegram but do not respond in those channels)
  receive_only_channels: []

  admin_nodes:
    - '1b8c7774' # node id of an admin node that can use /admin command
  # Send a direct message to each admin node when the bot starts
  notify_admins_on_start: true

  commands:
    ping: true   # /ping command to get your hop count and node id back
    help: true   # /help command
    ai: false    # enable /ai mesh command (feature key 'aim')
    travel: true # enable /travel safety reminder command
  # Template for /travel replies; supported placeholders:
  #   {from_short} {to_short} {hops_away} {hops_limit} {hops_start} {signal} {signal_emoji}
  travel_template: "✈️ Safe travels — signal: {signal_emoji} {signal}, hops: {hops_away}. Carry a power bank and share your route in FB groups."
  
  reply_directly: false # if true, replies go directly to the sender instead of the channel
  # Master mesh AI feature flag (aim)
  ai_enabled: false

  # Action when the serial connection is lost or becomes unhealthy:
  #   - exit: terminate the process so Docker/systemd can restart it (default)
  #   - reconnect: keep trying to reconnect
  on_disconnect: exit

  # Optional regex-based triggers to transform inbound mesh messages into commands
  # Each rule has:
  #   key: regex pattern (Python re, case-insensitive)
  #        NOTE: In YAML strings, backslashes must be escaped. For example, use "\\b" for a word boundary.
  #   op:  one of [replace, prepend, reply]
  #   val: replacement string / prefix (for replace/prepend) or a reply template for 'reply'.
  #        Template supports: {short_name}, {from_short}, {to_short}, {hops_away}, {hops_limit}, {hops_start},
  #        {rssi}, {snr}, {signal_emoji}, {signal} (aka signal_label), {mqtt_flag}, {channel_num}, {channel_name}.
  triggers:
    - key: "^(ai|bot|бот|аи|ии)[:,\\s]+" # trigger by "bot," "bot:" "bot "
      op: "replace"
      val: "/ai "
    - key: "^(test(ing)?|тест)\\b"
      op: "reply"
      val: "{short_name}: Ack. Signal {signal_emoji} {signal}. HopsAway={hops_away}, HStart={hops_start}, HLimit={hops_limit}, RSSI={rssi}, SNR={snr}{mqtt_flag}. Better use /ping command. And even better use it in Direct Message."
    - key: "(flight|plane|airplane|flying|airport|boarding|takeoff|landing|in the air|travel|cruise|jet|aircraft|aviation|boat|ship|sail|🚀|🛩️|🛫|🛬|✈️|🛩|🛥️|🚢|⛴️|⛵|🛶|🚤|🛳️|🚗|🚙|🚕|🚓|🚚|🚛|🚜|🏍️|🛵|🚲|🚌|🚎|🚐|🚒|🚑|🚃|🚄|🚅|🚆|🚇|🚈|🚉|🚊|🚝|🚞|🚋|🚍|🚔|🚖|🚘|🏔️|⛰️|🏕️|🏞️|🎒|🧗|🧗‍♂️|🧗‍♀️|🚵|🚵‍♂️|🚵‍♀️|🏂|⛷️|🏄|🏄‍♂️|🏄‍♀️|🏊|🏊‍♂️|🏊‍♀️|🌍|🌎|🌏|🗺️|🧳|🏨|🏩|🏬|🏯|🏰|🗽|🗼|🕌|⛩️|🕍|🛎️|🏝️|🏖️|🏜️|🏟️|🎢|🎡|🎠)"
      op: "prepend"
      val: "/travel"

  # Link template to a node info page; {node_id} is replaced with the numeric id
  node_info_link: "https://meshmap.net/{node_id}"
  # Alternative example:
  # node_info_link: "https://malla.varna.radio/node/{node_id}"

# Optional human-friendly names for mesh channel indices
channels:
  - "LongFast"   # 0
  - "Bulgaria"   # 1

reports:
  # Control what information Meshgram posts/updates in Telegram
  telemetry: true
  location: false
  nodes: true

# Thread IDs for Telegram Topics (used when telegram.use_topics=true)
# How to get message_thread_id: https://stackoverflow.com/a/75178418/420585
topics:
  telemetry: 907
  location: 909
  nodes: 918
  channel0: 914
  channel1: 911

telemetry:
  # Periodically run a script and publish its metrics to the mesh
  environment_enabled: false
  environment_script: "./data/ha.sh"
  environment_send_interval: 300  # seconds

logging:
  # Global log level: debug | info | warn | error
  level: "info"
  # Per-library overrides (to reduce noise)
  level_telegram: "warn"
  level_httpx: "warn"
  # Write logs to a file as well as console
  file_log: false
  file_path: "data/meshgram.log"
  # Also send logs to syslog (optional)
  use_syslog: false
  syslog_host: "127.0.0.1"
  syslog_port: 514
  syslog_protocol: "udp"  # udp or tcp

# AI configuration (select provider + options)
ai:
  # Which backend to use: 'ollama' (local) or 'openai' (OpenAI-compatible)
  provider: ollama

  # Common options
  enable_tools: false       # allow model to call tools (function calling)
  enable_thinking: false   # request chain-of-thought tokens (Ollama only)
  strip_thinking: true     # strip visible "thinking/reasoning" blocks from final reply
  system_prompt: |
    You are a helpful assistant running on a Meshtastic <-> Telegram bridge. Keep answers concise.
    You speak only in Bulgarian, unless the user specifically asks you to respond in English.
    If the user asks you to translate something, you can do so, but only if it is a short phrase or sentence. Do not translate long texts or documents.
    If the user asks you to write code, you can do so, but only if it is a short snippet. Do not write long programs or scripts.
    If the user asks you to generate text, you can do so, but only if it is a short paragraph or two. Do not generate long articles or essays.
    Always be funny and picky.
    Always answer short and concise.
    You may use tools to answer questions; only call tools when necessary.

  # OpenAI-compatible settings (used when provider=openai)
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    # API key for Authorization: Bearer <key> header (required for api.openai.com or CloudFlare API_TOKEN)
    # api_key: "${OPENAI_API_KEY}"
    # CloudFlare example:
    # base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1" # cloudflare
    # model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    # api_key: "${CLOUDFLARE_API_TOKEN}"

  # Ollama-specific settings (used when provider=ollama)
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "llama3.1"

# BBS (private messages) configuration
bbs:
  enabled: true
  send_message_expire_days: 7
  outbox:
    max_per_sender: 10
  notify:
    cooldown_hours: 6
  session_index_ttl_seconds: 180

