---
# config/config.yaml
#
# please use https://direnv.net/ or similar to manage the environment variables

telegram:
  bot_token: "1111111111:XXXXX-XX-XXXXXXXXXXXXXX-XXX_XXXXXXX" # https://core.telegram.org/bots/tutorial
  chat_id: "-1111111111111"
  authorized_users:
    - 1111111111
  enable_message_forwarding: False # forward messages from telegram to the meshtastic network

meshtastic:
  connection_type: 'serial'  # 'serial' or 'tcp'
  device: "/dev/ttyACM0" # for serial connection
  #default_node_id: '!da73e1bc'
  default_node_id: '^all' # where to send the telegram messages
  #default_channel_id: 0 # meshtastic channel send the telegram messages to
  #ignored_channels: # channels to ignore (do not send them to telegram)
  #  - 0
  #  - 1
  #  - 2
  heartbeat_timeout: 300 # timeout in seconds for node heartbeats
  #local_nodes:
  #  - '!ba66fc64'

channels:
  - 'LongFast'
  - 'Bulgaria'

reports:
  telemetry: False
  location: False
  nodes: True

logging:
  level: 'info'
  level_telegram: 'warn'
  level_httpx: 'warn'
  use_syslog: false
  syslog_host: "127.0.0.1"
  syslog_port: 514
  syslog_protocol: 'udp'  # 'udp' or 'tcp'

